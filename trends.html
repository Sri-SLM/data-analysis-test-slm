<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Analytics Trends • C-A Health</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #050417;
            --bg-2: #071029;
            --accent-neon: #00ffe1;
            --accent-purple: #8b5cf6;
            --card: rgba(12, 20, 37, 0.8);
            --text: #e6f7ff;
            --muted: #9aa4b2;
            --border: rgba(0, 255, 225, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title-group h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--text);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        /* Medical HUD info box */
        .info-box {
            background: rgba(0, 255, 225, 0.05);
            border-left: 3px solid var(--accent-neon);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #b8fff0;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-count {
            color: var(--accent-neon);
            font-family: 'Orbitron', sans-serif;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            color: var(--accent-neon);
            font-family: monospace;
            font-size: 12px;
            resize: none;
            margin-bottom: 15px;
        }

        .btn-group { display: flex; gap: 10px; }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-update { background: var(--accent-neon); color: #050417; }
        .btn-update:hover { box-shadow: 0 0 15px rgba(0, 255, 225, 0.4); transform: translateY(-2px); }
        .btn-clear { background: transparent; border: 1px solid #ff5a5a; color: #ff5a5a; }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .chart-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-neon);
            display: inline-block;
        }

        .chart-container { height: 300px; position: relative; }

        .error { border-left-color: #ff5a5a; color: #ff9494; background: rgba(255, 90, 90, 0.05); }

        @media (max-width: 900px) {
            .input-section, .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-group">
            <h1>Bio-Analytics Trends</h1>
            <p class="subtitle">Longitudinal Clinical Data Visualization</p>
        </div>
        <button class="tab" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white;" onclick="location.href='test-ca.html'">Return to HUD</button>
    </div>

    <div class="info-box" id="global-status">
        📡 SYSTEM STATUS: MONITORING ACTIVE • DATA SYNCED WITH CLOUD VAULT
    </div>

    <div class="input-section">
        <div class="card">
            <div class="input-label">Telemetry Stream A <span class="data-count" id="count1">0 Pts</span></div>
            <textarea id="data1" placeholder="CSV Stream: 72, 75, 80..."></textarea>
            <div class="btn-group">
                <button class="btn-update" onclick="updateChart(1)">Update Stream</button>
                <button class="btn-clear" onclick="clearData(1)">Purge</button>
            </div>
        </div>

        <div class="card">
            <div class="input-label">Telemetry Stream B <span class="data-count" id="count2">0 Pts</span></div>
            <textarea id="data2" placeholder="CSV Stream: 55, 60, 58..."></textarea>
            <div class="btn-group">
                <button class="btn-update" onclick="updateChart(2)">Update Stream</button>
                <button class="btn-clear" onclick="clearData(2)">Purge</button>
            </div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="card">
            <div class="chart-title" id="title1">Graphical Display 1 (STEPS)</div>
            <div class="chart-container">
                <canvas id="chart1"></canvas>
            </div>
        </div>
        <div class="card">
            <div class="chart-title" id="title2">Graphical Display 2 (Heart Rate)</div>
            <div class="chart-container">
                <canvas id="chart2"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    let chart1Instance = null;
    let chart2Instance = null;

    window.addEventListener('DOMContentLoaded', () => {
        loadFromLocalStorage();
    });

    function loadFromLocalStorage() {
        const stepsCSV = localStorage.getItem('stepsCSV') || "2000, 4500, 3200, 8000, 12000, 9000, 7500";
        const hrCSV = localStorage.getItem('hrCSV') || "72, 75, 71, 88, 92, 76, 74";

        document.getElementById('data1').value = stepsCSV;
        document.getElementById('data2').value = hrCSV;
        
        updateDataCount(1);
        updateDataCount(2);
        updateChart(1);
        updateChart(2);
    }

    function updateDataCount(n) {
        const val = document.getElementById(`data${n}`).value;
        const count = val.split(',').filter(x => x.trim() !== '').length;
        document.getElementById(`count${n}`).textContent = `${count} Pts`;
    }

    function clearData(n) {
        document.getElementById(`data${n}`).value = '';
        updateDataCount(n);
    }

    function updateChart(n) {
        const rawData = document.getElementById(`data${n}`).value;
        const values = rawData.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
        const ctx = document.getElementById(`chart${n}`).getContext('2d');
        
        if (n === 1 && chart1Instance) chart1Instance.destroy();
        if (n === 2 && chart2Instance) chart2Instance.destroy();

        const neonColor = n === 1 ? '#00ffe1' : '#8b5cf6';
        const glowColor = n === 1 ? 'rgba(0, 255, 225, 0.1)' : 'rgba(139, 92, 246, 0.1)';

        const config = {
            type: 'line',
            data: {
                labels: values.map((_, i) => i + 1),
                datasets: [{
                    data: values,
                    borderColor: neonColor,
                    backgroundColor: glowColor,
                    fill: true,
                    tension: 0.4,
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: neonColor
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#9aa4b2', font: { family: 'Orbitron' } }
                    },
                    x: { 
                        grid: { display: false },
                        ticks: { color: '#9aa4b2', font: { family: 'Orbitron' } }
                    }
                }
            }
        };

        const newChart = new Chart(ctx, config);
        if (n === 1) chart1Instance = newChart; else chart2Instance = newChart;
    }
</script>
</body>
</html>
