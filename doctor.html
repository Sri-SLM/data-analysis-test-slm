<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C-A Analytics - Doctor Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Baloo+2:wght@400;600&family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1480.0.min.js"></script>
  <style>
    :root {
      --bg-1:#050417; --bg-2:#071029; --accent-1:#ff5aa6; --accent-2:#ffd86b;
      --accent-3:#3fffe0; --neon-1:#00ffe1; --neon-2:#8b5cf6; --card:rgba(2,8,23,0.64);
      --muted:#9aa4b2; --text:#e6f7ff; --hud:#041224;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: 'Poppins', sans-serif; color:var(--text); min-height:100vh;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      display:flex; flex-direction:column; gap:24px; padding:28px; background-attachment:fixed;
    }
    .header{z-index:20; display:flex; flex-direction:column; gap:14px}
    .title{font-family:'Baloo 2', sans-serif; font-size:26px; color:var(--text);}
    .tabs{display:flex; flex-wrap:wrap; gap:10px}
    .tab{cursor:pointer; padding:8px 14px; border-radius:10px; font-weight:700; font-size:13px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--text); text-transform:uppercase;}
    .tab-priority{background:linear-gradient(90deg,var(--neon-1),#66fff0); color:#041224; padding:10px 18px; border-radius:12px;}
    .container{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px;}
    .card{background:var(--card); border-radius:12px; padding:16px; border:1px solid rgba(0,255,230,0.06); position:relative;}
    .card-title{font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; display:flex; gap:8px; align-items:center}
    .card-title:before{content:''; width:10px; height:10px; border-radius:2px; background:var(--neon-1);}
    .metric{font-size:36px; font-weight:800; color:var(--neon-1); font-family:'Orbitron',sans-serif;}
    .unit{font-size:12px; color:var(--muted); margin-left:6px}
    textarea {background:rgba(2,8,23,0.4); border:1px solid rgba(0,255,230,0.12); color:var(--text); border-radius:8px; padding:10px; width:100%; height:120px; resize:none; font-family:'Poppins';}
    .btn-save{margin-top:12px; padding:10px 20px; border-radius:8px; background:linear-gradient(90deg,var(--neon-1),#66fff0); border:none; color:var(--hud); font-weight:700; cursor:pointer; width:100%;}
  </style>
</head>
<body>

  <div class="header">
    <div class="title">Clinical Review Analytics</div>
    <div class="tabs">
      <div class="tab tab-priority" onclick="location.href='trends.html'">Trends</div>
      <div class="tab">Active Monitoring</div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">Steps (24h)</div>
      <div class="metric" id="steps">-- <span class="unit">steps</span></div>
    </div>
    <div class="card">
      <div class="card-title">Heart Rate</div>
      <div class="metric" id="hr">-- <span class="unit">bpm</span></div>
    </div>
    <div class="card">
      <div class="card-title">HRV</div>
      <div class="metric" id="hrv">-- <span class="unit">ms</span></div>
    </div>
    <div class="card">
      <div class="card-title">Stress</div>
      <div class="metric" id="stress">-- <span class="unit">level</span></div>
    </div>
    <div class="card">
      <div class="card-title">Sleep</div>
      <div class="metric" id="sleep">-- <span class="unit">hours</span></div>
    </div>

    <div class="card" style="grid-column: span 2;">
      <div class="card-title">Clinical Notes (S3 Sync)</div>
      <textarea id="doctorNotes" placeholder="Enter patient evaluation..."></textarea>
      <button id="saveNotesBtn" class="btn-save">SYNC TO DOCTOR_NOTES</button>
      <div id="saveStatus" style="margin-top:8px; font-size:12px; color:var(--muted); text-align:center;">Status: Standby</div>
    </div>
  </div>

  <script>
    // --- PART 1: CSV DATA FETCH ---
    (function(){
      const STORAGE_KEY = 'dailyHealthCSV';
      const REFRESH_INTERVAL = 30000; // 30s

      function updateMetric(el, value, unit) {
        if (!el) return;
        el.textContent = '';
        el.textContent = `${value} `;
        const unitEl = document.createElement('span');
        unitEl.className = 'unit';
        unitEl.textContent = unit;
        el.appendChild(unitEl);
      }

      function parseCsv() {
        const csv = localStorage.getItem(STORAGE_KEY);
        if (!csv) return [];

        const lines = csv.trim().split('\n');
        if (lines.length < 2) return [];

        const records = [];
        for (let i = 1; i < lines.length; i++) {
          const [date, steps, hr] = lines[i].split(',');
          records.push({ date, steps: steps || '--', hr: hr || '--' });
        }

        return records;
      }

      function getLatestCsvRecord() {
        const rows = parseCsv();
        if (!rows.length) return null;
        rows.sort((a, b) => b.date.localeCompare(a.date));
        return rows[0];
      }

      function updateDashboard() {
        const latest = getLatestCsvRecord();
        if (latest) {
          let steps = latest.steps;
          let hr = latest.hr;
          if (hr === '--') hr = '70';
          updateMetric(document.getElementById('steps'), steps, 'steps');
          updateMetric(document.getElementById('hr'), hr, 'bpm');
        } else {
          updateMetric(document.getElementById('steps'), '--', 'steps');
          updateMetric(document.getElementById('hr'), '70', 'bpm');
        }
        updateMetric(document.getElementById('hrv'), '40', 'ms');
        updateMetric(document.getElementById('stress'), '2', 'level');
        updateMetric(document.getElementById('sleep'), '8', 'hours');
      }

      // Load and display from localStorage immediately
      updateDashboard();
      setInterval(updateDashboard, REFRESH_INTERVAL);
    })();

    // --- PART 2: S3 WORKER SYNC FOR NOTES ---
    const AWS_CONFIG = {
        accessKeyId: "AKIA2UC3AI5QQAVDHGXZ",
        secretAccessKey: "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",
        region: "us-east-2",
        bucket: "compu-alert-s3"
    };

    AWS.config.update({ accessKeyId: AWS_CONFIG.accessKeyId, secretAccessKey: AWS_CONFIG.secretAccessKey, region: AWS_CONFIG.region });
    const s3 = new AWS.S3();
    const dateStr = new Date().toISOString().slice(0,10);
    const notesKey = `doctor_notes/${dateStr}.json`;

    // Load today's notes
    async function fetchLatestNotes(){
        try {
            const data = await s3.getObject({ Bucket: AWS_CONFIG.bucket, Key: notesKey }).promise();
            const json = JSON.parse(data.Body.toString());
            document.getElementById('doctorNotes').value = json.notes || '';
            document.getElementById('saveStatus').textContent = "Latest notes loaded.";
        } catch(e) { console.log("New day, new note."); }
    }
    fetchLatestNotes();

    // Save notes
    document.getElementById('saveNotesBtn').addEventListener('click', async () => {
        const notes = document.getElementById('doctorNotes').value;
        const status = document.getElementById('saveStatus');
        status.textContent = "Syncing with Cloud Worker...";

        const payload = {
            data_type: "doctor_notes",
            date: dateStr,
            notes: notes,
            timestamp: new Date().toISOString()
        };

        try {
            await s3.putObject({
                Bucket: AWS_CONFIG.bucket,
                Key: notesKey,
                Body: JSON.stringify(payload),
                ContentType: "application/json"
            }).promise();
            status.textContent = "✅ Successfully synced: " + notesKey;
        } catch (err) {
            status.textContent = "❌ Sync Failed. Check Permissions.";
        }
    });
  </script>
</body>
</html>
