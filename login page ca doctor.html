<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practitioner Portal | C-A Health Systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --med-blue: #0056b3;
      --clinical-white: #f8fafc;
      --steth-grey: #475569;
      --border-thin: #cbd5e1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body { 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background-color: var(--clinical-white);
      background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
      background-size: 24px 24px;
    }

    .practitioner-card { 
      width: 400px; 
      background: #ffffff; 
      padding: 48px 40px; 
      border-radius: 12px; 
      border: 1px solid var(--border-thin);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .hospital-icon { color: var(--med-blue); font-size: 2.2rem; margin-bottom: 12px; display: block; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #1e293b; letter-spacing: -0.5px; text-transform: uppercase; }
    .subtitle { font-size: 0.8rem; color: var(--steth-grey); margin-bottom: 32px; font-weight: 500; letter-spacing: 0.5px; }

    .input-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 0.75rem; color: #1e293b; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
    
    /* Input styling to look official yet read-only */
    input { 
      width: 100%; 
      padding: 14px; 
      border-radius: 6px; 
      border: 1.5px solid var(--border-thin); 
      font-size: 0.95rem; 
      background: #f8fafc; 
      color: #334155;
    }

    .btn-link { 
      display: block;
      width: 100%; 
      margin-top: 12px; 
      padding: 16px; 
      background: var(--med-blue); 
      color: #fff; 
      text-decoration: none;
      font-size: 1rem; 
      font-weight: 700; 
      border-radius: 6px;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-link:hover { background: #004494; box-shadow: 0 4px 12px rgba(0, 86, 179, 0.2); }

    .footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-thin); color: #94a3b8; font-size: 0.7rem; font-weight: 500; line-height: 1.5; }
  </style>
</head>
<body>

<div class="practitioner-card">
  <span class="hospital-icon">✚</span>
  <div class="logo">C-A Health Systems</div>
  <div class="subtitle">SECURE CLINICAL DATA ACCESS</div>

  <div class="input-group">
    <label>Practitioner ID</label>
    <input type="email" value="doctor@hospital.org" readonly />
  </div>

  <div class="input-group" style="margin-bottom: 30px;">
    <label>Security Key</label>
    <input type="password" value="••••••••••••" readonly />
  </div>

  <a href="doctor.html" class="btn-link">AUTHORIZE & ENTER</a>

  <div class="footer">
      SYSTEM STATUS: OPTIMAL<br>
      ENCRYPTED SESSION • HIPAA COMPLIANT<br>
      © 2026 C-A SOFTWARE MEDICAL DIVISION
  </div>
</div>

</body>
</html>
